name: Model Training CICD

permissions:
  contents: write

on:
  push:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: iterative/setup-cml@v2

      - name: Train model
        run: |
          pip install -r requirements.txt
          python train_model.py

      - name: Upload plots and scores
        uses: actions/upload-artifact@v7
        with:
          name: model-report
          path: |
            ConfusionMatrix.png
            FeatureImportance.png
            scores.txt

      - name: Post CML comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## RF and LR Model Score" > report.md
          cat scores.txt >> report.md
          echo "" >> report.md
          echo "Plots: download the **model-report** artifact from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> report.md
          cml comment create report.md
